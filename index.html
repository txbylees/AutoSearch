<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Search — UK Car Research</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d0d0d;
  --ink2:#3a3a3a;
  --ink3:#7a7a7a;
  --paper:#f5f4f0;
  --white:#ffffff;
  --line:#e0dfd8;
  --red:#c0392b;
  --red-bg:#fdf0ee;
  --amber:#b45309;
  --amber-bg:#fefce8;
  --green:#166534;
  --green-bg:#f0fdf4;
  --blue:#1d4ed8;
  --blue-bg:#eff6ff;
}
body{font-family:'Barlow',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:0 1.5rem 5rem}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:4px}
.logo-auto{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink)}
.logo-search{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:300;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3)}
.logo-dot{width:6px;height:6px;background:var(--red);border-radius:50%;margin-bottom:2px;flex-shrink:0}
.nav-tag{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3)}

/* HERO */
.hero{padding:3.5rem 0 2.5rem;border-bottom:1px solid var(--line)}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:2rem;flex-wrap:wrap;margin-bottom:2rem}
.hero-headline{font-family:'Barlow Condensed',sans-serif;font-size:clamp(3rem,8vw,5rem);font-weight:700;line-height:0.95;text-transform:uppercase;letter-spacing:-0.01em}
.hero-headline span{color:var(--ink3);font-weight:300}
.hero-sub{max-width:260px;font-size:0.85rem;color:var(--ink3);line-height:1.6;padding-top:0.5rem}

/* SEARCH */
.search-zone{padding:2rem 0}
.search-inner{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--white)}
.plate-prefix{background:var(--ink);color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:0 14px;display:flex;align-items:center;border-right:1.5px solid var(--ink)}
.reg-field{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:0.8rem 1rem;border:none;outline:none;color:var(--ink);background:transparent}
.reg-field::placeholder{color:#ccc;font-weight:300}
.go-btn{background:var(--ink);color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:0 1.5rem;border:none;cursor:pointer;transition:opacity 0.15s;white-space:nowrap}
.go-btn:hover{opacity:0.8}
.go-btn:disabled{opacity:0.35;cursor:not-allowed}
.demo-hint{margin-top:0.75rem;font-size:0.75rem;color:var(--ink3)}
.demo-hint button{background:none;border:none;color:var(--blue);font-size:0.75rem;cursor:pointer;font-family:'Barlow',sans-serif;text-decoration:underline}

/* STATUS */
.status{text-align:center;padding:3rem 0;color:var(--ink3);font-size:0.9rem}
.spin{display:inline-block;width:18px;height:18px;border:1.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESULTS */
.results{animation:fadeUp 0.4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* PLATE HERO CARD */
.plate-card{background:var(--ink);color:var(--white);border-radius:6px;padding:2rem;margin-bottom:1.25rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end}
.plate-make{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;opacity:0.45;margin-bottom:0.4rem}
.plate-model{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.2rem,5vw,3.2rem);font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:0.5rem}
.plate-detail{font-size:0.82rem;opacity:0.55;line-height:1.5}
.plate-reg-display{font-family:'Barlow Condensed',sans-serif;font-size:2.6rem;font-weight:700;letter-spacing:0.14em;background:var(--white);color:var(--ink);padding:0.3rem 1rem;border-radius:4px;text-align:center;line-height:1.1}
.plate-reg-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;text-align:center;opacity:0.5;margin-top:4px}

/* GRID CARDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.grid1{margin-bottom:1.25rem}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.plate-card{grid-template-columns:1fr}}

.card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:1.5rem}
.card-label{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--line)}

/* SPEC GRID */
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec-cell{padding:0.6rem 0.75rem;background:var(--paper);border-radius:4px}
.spec-k{font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.spec-v{font-size:0.9rem;font-weight:500;color:var(--ink)}

/* STATUS PILLS */
.pill{display:inline-block;font-size:0.7rem;font-weight:500;letter-spacing:0.04em;padding:3px 9px;border-radius:3px}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:var(--red-bg);color:var(--red)}

/* PRICE */
.price-fig{font-family:'Barlow Condensed',sans-serif;font-size:3.2rem;font-weight:700;line-height:1;letter-spacing:-0.01em;color:var(--ink);margin-bottom:0.25rem}
.price-range{font-size:0.78rem;color:var(--ink3);margin-bottom:1rem}
.price-range strong{color:var(--ink2)}
.price-note{font-size:0.82rem;color:var(--ink2);line-height:1.65}
.value-bar{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.value-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.value-fill{height:100%;background:linear-gradient(90deg,var(--green),#22c55e);width:78%;border-radius:3px}
.value-labels{display:flex;justify-content:space-between;font-size:0.68rem;color:var(--ink3)}

/* WATCHOUTS */
.wo-list{display:flex;flex-direction:column;gap:8px}
.wo{display:flex;gap:10px;padding:0.75rem 0.9rem;border-radius:5px;font-size:0.83rem;line-height:1.5}
.wo-h{background:var(--red-bg);color:var(--red)}
.wo-m{background:var(--amber-bg);color:var(--amber)}
.wo-l{background:var(--green-bg);color:var(--green)}
.wo-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.wo-h .wo-dot{background:var(--red)}
.wo-m .wo-dot{background:var(--amber)}
.wo-l .wo-dot{background:var(--green)}
.wo strong{font-weight:500}

/* RARITY */
.rarity-num{font-family:'Barlow Condensed',sans-serif;font-size:4rem;font-weight:700;line-height:1;color:var(--ink);display:inline-block}
.rarity-denom{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;color:var(--ink3);font-weight:300}
.rarity-badge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:3px;margin-left:8px;background:var(--amber-bg);color:var(--amber);vertical-align:middle}
.rarity-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:1rem 0 0.5rem}
.rarity-fill{height:100%;background:var(--ink);border-radius:3px;transition:width 0.9s cubic-bezier(.4,0,.2,1)}
.rarity-scale{display:flex;justify-content:space-between;font-size:0.65rem;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em}
.rarity-context{font-size:0.82rem;color:var(--ink2);line-height:1.6;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--line)}

/* NEWS */
.news-list{display:flex;flex-direction:column}
.news-item{padding:0.9rem 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.news-item:last-child{border-bottom:none;padding-bottom:0}
.news-num{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;color:var(--line);min-width:20px;padding-top:1px}
.news-title{font-size:0.88rem;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:3px}
.news-meta{font-size:0.72rem;color:var(--ink3)}

/* PHOTO STRIP */
.photo-strip{display:flex;gap:8px;margin-bottom:1.25rem;overflow-x:auto;padding-bottom:2px}
.photo-strip::-webkit-scrollbar{height:3px}
.photo-strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.photo-thumb{flex-shrink:0;width:180px;height:112px;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative;cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.2s ease;display:block}
.photo-thumb:hover img{transform:scale(1.04)}
.photo-caption{position:absolute;bottom:0;left:0;right:0;background:rgba(13,13,13,0.55);color:#fff;font-size:0.6rem;letter-spacing:0.04em;padding:4px 7px;text-transform:uppercase}

/* FSH BADGE */
.fsh-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green);font-size:0.75rem;font-weight:500;padding:5px 12px;border-radius:4px;margin-top:0.75rem}
.fsh-check{width:14px;height:14px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}


</style>
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <div class="logo">
      <span class="logo-auto">Auto</span>
      <div class="logo-dot"></div>
      <span class="logo-search">Search</span>
    </div>
    <span class="nav-tag">UK Car Research</span>
  </nav>

  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-headline">Know your<br><span>car before</span><br>you buy.</div>
      </div>
      <div class="hero-sub">Enter any UK registration plate. Get specs, estimated value, known issues, rarity and more — instantly.</div>
    </div>

    <div class="search-zone">
      <div class="search-inner">
        <div class="plate-prefix">UK</div>
        <input class="reg-field" id="regInput" type="text" placeholder="AB12 CDE" maxlength="8" autocomplete="off" />
        <button class="go-btn" id="goBtn" onclick="handleSearch()">Search →</button>
      </div>
      <div class="demo-hint">Try the demo: <button onclick="loadDemo()">N12 KNL — 2018 BMW M2 (N55)</button></div>
    </div>
  </div>



  <div id="output" style="padding-top:1.5rem"></div>
</div>

<script>
document.getElementById('regInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSearch();
});

function setOutput(h) { document.getElementById('output').innerHTML = h; }
function showStatus(msg) { setOutput(`<div class="status"><span class="spin"></span>${msg}</div>`); }

// ─── MOCK DATA (BMW M2 demo) ───────────────────────────────────────────────
const MOCK = {
  reg: 'N12 KNL',
  make: 'BMW',
  model: 'M2',
  year: 2018,
  colour: 'Long Beach Blue',
  fuel: 'Petrol',
  engine: '2979 cc',
  co2: '194 g/km',
  tax: 'Taxed',
  mot: 'Valid',
  euro: 'Euro 6',
  transmission: 'Manual (6-speed)',
  bhp: '370 bhp',
  doors: '2 door Coupé',
  fsh: true,
  summary: 'The original F87 M2 with the N55 single-turbo straight-six — widely considered the purest, most characterful M car of its era. Lighter and more driver-focused than the later Competition, with a free-revving engine that rewards commitment. A high-spec Long Beach Blue example with FSH is one of the most desirable used M cars on the market right now.',
  price: {
    est: 36500,
    low: 32000,
    high: 41000,
    reasoning: 'Original N55 M2s in sought-after colours like Long Beach Blue with manual gearbox and FSH command a strong premium. Values have held firm and are gently appreciating as buyers recognise the N55 as the more analogue, characterful choice over the Competition. FSH and high spec push this toward the upper end of the range.'
  },
  watchouts: [
    { sev: 'h', issue: 'Coolant expansion tank cracking', detail: 'The plastic coolant expansion tank is a known failure point on N55-engined cars and can crack without warning. Cheap to replace but potentially serious if ignored — inspect carefully and ask if it has been replaced.' },
    { sev: 'h', issue: 'Previous track or hard use', detail: 'The M2 is a popular track day car. Check for signs of roll cage fitment, harness mounts, or stripped interiors. Inspect tyres for unusual wear patterns and ask for a full usage history.' },
    { sev: 'm', issue: 'Turbo boost pipe splitting', detail: 'The N55 boost pipe (charge pipe) is prone to splitting under pressure, especially on tuned cars. A common upgrade to aluminium is worth confirming — check for any boost-related fault codes.' },
    { sev: 'm', issue: 'Carbon build-up on intake valves', detail: 'Like all direct-injection engines, the N55 accumulates carbon deposits on intake valves over time. Ask whether a walnut blast has been carried out — typically needed around 40–50k miles.' },
    { sev: 'm', issue: 'Differential wear', detail: 'The rear LSD can show wear on high-mileage or hard-driven examples. Listen for clunking or binding on low-speed turns and ask about differential service history.' },
    { sev: 'l', issue: 'Front splitter & underbody damage', detail: 'The low front splitter is easily caught on kerbs and ramps. Inspect for cracks or poorly repaired sections — mostly cosmetic, but gives a good indication of how carefully the car has been used.' },
  ],
  rarity: {
    score: 67,
    label: 'Relatively rare',
    units: '~3,800 on UK roads',
    context: 'The original N55-engined F87 M2 was sold in smaller numbers than the later Competition, and Long Beach Blue was never a common choice — making this combination genuinely hard to find in clean, FSH condition. Collector interest is growing as the N55 gains a reputation as the more engaging driver\'s car.'
  },
  photos: [
    { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/2016_BMW_M2_Auto.jpg/640px-2016_BMW_M2_Auto.jpg', caption: 'Front 3/4' },
    { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/2017_BMW_M2_Automatic_3.0_Front.jpg/640px-2017_BMW_M2_Automatic_3.0_Front.jpg', caption: 'Front' },
    { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/BMW_M2_F87_2021_%282%29.jpg/640px-BMW_M2_F87_2021_%282%29.jpg', caption: 'Rear' },
    { url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/BMW_M2%2C_IAA_2017%2C_Frankfurt_%281Y7A3531%29.jpg/640px-BMW_M2%2C_IAA_2017%2C_Frankfurt_%281Y7A3531%29.jpg', caption: 'IAA 2017' },
  ],
  news: [
    { title: 'BMW M2 N55 vs Competition: Why the Original Is Now the One to Buy', source: 'Evo Magazine', meta: "Makes the case for the N55 over the S55 — directly relevant to this car" },
    { title: 'Are Original F87 M2 Values on the Rise?', source: 'Autocar', meta: 'Examines the appreciation trend for N55 cars specifically' },
    { title: 'N55 Charge Pipe: The Cheap Fix Every M2 Owner Should Know About', source: 'BMW Blog', meta: 'Covers the most common mechanical weak point on this engine' },
    { title: 'Long Beach Blue M2: The Colour That Commands a Premium', source: 'Car & Classic', meta: 'Colour rarity and its growing effect on resale values' },
    { title: 'BMW M2 F87 Buying Guide: What to Check Before You Buy', source: 'Pistonheads', meta: 'Comprehensive used buying guide covering all key inspection points' },
  ]
};

// ─── DEMO LOADER ──────────────────────────────────────────────────────────
function loadDemo() {
  document.getElementById('regInput').value = 'N12 KNL';
  renderResult(MOCK);
}

// ─── DVLA API CALL ────────────────────────────────────────────────────────
async function fetchDVLA(reg, apiKey) {
  const clean = reg.replace(/\s/g, '').toUpperCase();
  const resp = await fetch('https://driver-vehicle-licensing.api.gov.uk/vehicle-enquiry/v1/vehicles', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
    body: JSON.stringify({ registrationNumber: clean })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.errors?.[0]?.detail || `DVLA error ${resp.status}`);
  }
  return resp.json();
}

// ─── ANTHROPIC AI ANALYSIS ────────────────────────────────────────────────
async function fetchAIAnalysis(dvlaData, reg, anthropicKey) {
  const prompt = `You are an expert UK automotive analyst helping a buyer research a used car.

DVLA data for registration ${reg}:
${JSON.stringify(dvlaData, null, 2)}

Return ONLY valid JSON (no markdown, no backticks) with this exact structure:
{
  "make": "BMW",
  "model": "M2",
  "transmission": "Manual (6-speed)",
  "bhp": "370 bhp",
  "doors": "2 door Coupé",
  "fsh": false,
  "summary": "1-2 sentence punchy summary of the car",
  "price": {
    "estimate": 12500,
    "low": 10000,
    "high": 15000,
    "reasoning": "2-3 sentences explaining the estimate"
  },
  "watchouts": [
    {"severity": "high", "issue": "Issue title", "detail": "Brief explanation"},
    {"severity": "med", "issue": "Issue title", "detail": "Brief explanation"},
    {"severity": "low", "issue": "Issue title", "detail": "Brief explanation"}
  ],
  "rarity": {
    "score": 72,
    "label": "Common",
    "estimated_uk_units": "~180,000 on UK roads",
    "context": "1-2 sentences about rarity in the UK market"
  },
  "news": [
    {"title": "Article headline", "source": "e.g. Autocar", "relevance": "why relevant"},
    {"title": "Article headline", "source": "e.g. What Car", "relevance": "why relevant"},
    {"title": "Article headline", "source": "e.g. Auto Express", "relevance": "why relevant"},
    {"title": "Article headline", "source": "e.g. Evo", "relevance": "why relevant"},
    {"title": "Article headline", "source": "e.g. Car & Classic", "relevance": "why relevant"}
  ]
}

For watchouts: include 4-6 items, mix of high/med/low — specific to this make, model, engine and year.
Rarity score: 0=extremely common, 100=extremely rare.
Prices in GBP integers. Be realistic and specific.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1500,
      system: 'You are a UK automotive expert. Return only valid JSON, no markdown.',
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!resp.ok) throw new Error(`AI error ${resp.status}`);
  const data = await resp.json();
  const text = data.content[0].text.replace(/```json|```/g, '').trim();
  return JSON.parse(text);
}

// ─── SEARCH HANDLER ───────────────────────────────────────────────────────
async function handleSearch() {
  const reg = document.getElementById('regInput').value.trim();

  if (!reg) { alert('Please enter a registration number.'); return; }

  // Use demo data if matching demo plate
  const cleanReg = reg.replace(/\s/g, '').toUpperCase();
  if (cleanReg === 'N12KNL') {
    showStatus('Looking up ' + reg.toUpperCase() + '…');
    setTimeout(() => { showStatus('Running AI analysis…'); setTimeout(() => renderResult(MOCK), 900); }, 800);
    return;
  }

  document.getElementById('goBtn').disabled = true;
  showStatus('Looking up ' + reg.toUpperCase() + '…');

  try {
    const dvla = await fetchDVLA(reg);
    showStatus('Got vehicle data. Running AI analysis…');
    const ai = await fetchAIAnalysis(dvla, reg);

    // Merge DVLA + AI into render format
    const merged = {
      reg: reg.toUpperCase(),
      make: dvla.make || ai.make || '—',
      model: ai.model || '—',
      year: dvla.yearOfManufacture || dvla.monthOfFirstRegistration?.slice(0,4) || '—',
      colour: dvla.colour || '—',
      fuel: dvla.fuelType || '—',
      engine: dvla.engineCapacity ? dvla.engineCapacity + ' cc' : '—',
      co2: dvla.co2Emissions ? dvla.co2Emissions + ' g/km' : '—',
      tax: dvla.taxStatus || '—',
      mot: dvla.motStatus || '—',
      euro: dvla.euroStatus || '—',
      transmission: ai.transmission || '—',
      bhp: ai.bhp || '—',
      doors: ai.doors || '—',
      fsh: ai.fsh || false,
      summary: ai.summary,
      price: { est: ai.price.estimate, low: ai.price.low, high: ai.price.high, reasoning: ai.price.reasoning },
      watchouts: ai.watchouts.map(w => ({ sev: w.severity === 'high' ? 'h' : w.severity === 'med' ? 'm' : 'l', issue: w.issue, detail: w.detail })),
      rarity: { score: ai.rarity.score, label: ai.rarity.label, units: ai.rarity.estimated_uk_units, context: ai.rarity.context },
      news: ai.news.map(n => ({ title: n.title, source: n.source, meta: n.relevance }))
    };

    renderResult(merged);
  } catch (err) {
    setOutput(`<div style="background:#fdf0ee;border:1px solid #fca5a5;border-radius:6px;padding:1.25rem 1.5rem;color:#c0392b;font-size:0.88rem;line-height:1.5"><strong>Something went wrong:</strong> ${err.message}<br><br>Check your registration and API keys are correct.</div>`);
  } finally {
    document.getElementById('goBtn').disabled = false;
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function renderResult(d) {
  const wos = d.watchouts.map(w => {
    const cls = w.sev === 'h' ? 'wo-h' : w.sev === 'm' ? 'wo-m' : 'wo-l';
    return `<div class="wo ${cls}"><span class="wo-dot"></span><span><strong>${w.issue}</strong> — ${w.detail}</span></div>`;
  }).join('');

  const news = d.news.map((n, i) =>
    `<div class="news-item">
      <div class="news-num">0${i + 1}</div>
      <div class="news-body">
        <div class="news-title">${n.title}</div>
        <div class="news-meta">${n.source} · ${n.meta}</div>
      </div>
    </div>`
  ).join('');

  const fshBadge = d.fsh
    ? `<div class="fsh-badge"><span class="fsh-check">✓</span> Full Service History confirmed</div>`
    : '';

  setOutput(`
    <div class="results">

      <div class="plate-card">
        <div>
          <div class="plate-make">${d.make}</div>
          <div class="plate-model">${d.model}</div>
          <div class="plate-detail">${d.year} · ${d.colour} · ${d.transmission}<br>${d.bhp} · ${d.doors}</div>
          ${fshBadge}
        </div>
        <div>
          <div class="plate-reg-display">${d.reg}</div>
          <div class="plate-reg-sub">UK Registration</div>
        </div>
      </div>

      ${d.photos && d.photos.length ? `
      <div class="photo-strip">
        ${d.photos.map(p => `
          <div class="photo-thumb">
            <img src="${p.url}" alt="${p.caption}" loading="lazy" onerror="this.closest('.photo-thumb').style.display='none'" />
            <div class="photo-caption">${p.caption}</div>
          </div>`).join('')}
      </div>` : ''}

      <div class="grid2">
        <div class="card">
          <div class="card-label">Specification</div>
          <div class="spec-grid">
            <div class="spec-cell"><div class="spec-k">Year</div><div class="spec-v">${d.year}</div></div>
            <div class="spec-cell"><div class="spec-k">Fuel</div><div class="spec-v">${d.fuel}</div></div>
            <div class="spec-cell"><div class="spec-k">Engine</div><div class="spec-v">${d.engine}</div></div>
            <div class="spec-cell"><div class="spec-k">CO₂</div><div class="spec-v">${d.co2}</div></div>
            <div class="spec-cell"><div class="spec-k">Euro</div><div class="spec-v">${d.euro}</div></div>
            <div class="spec-cell"><div class="spec-k">Colour</div><div class="spec-v">${d.colour}</div></div>
          </div>
          <div style="margin-top:0.9rem;padding-top:0.9rem;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
            <span class="pill pill-green">✓ ${d.tax}</span>
            <span class="pill pill-green">✓ MOT Valid</span>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Estimated value</div>
          <div class="price-fig">£${d.price.est.toLocaleString('en-GB')}</div>
          <div class="price-range">Range: <strong>£${d.price.low.toLocaleString('en-GB')}</strong> – <strong>£${d.price.high.toLocaleString('en-GB')}</strong></div>
          <div class="price-note">${d.price.reasoning}</div>
          <div class="value-bar">
            <div class="value-track"><div class="value-fill"></div></div>
            <div class="value-labels"><span>Below market</span><span>Strong value</span></div>
          </div>
        </div>
      </div>

      <div class="grid1 card">
        <div class="card-label">Things to watch out for</div>
        <div class="wo-list">${wos}</div>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="card-label">UK rarity</div>
          <div>
            <span class="rarity-num">${d.rarity.score}</span>
            <span class="rarity-denom">/100</span>
            <span class="rarity-badge">${d.rarity.label}</span>
          </div>
          <div class="rarity-track"><div class="rarity-fill" id="rfill" style="width:0%"></div></div>
          <div class="rarity-scale"><span>Common</span><span>Very rare</span></div>
          <div class="rarity-context"><strong>${d.rarity.units}</strong> estimated on UK roads.<br>${d.rarity.context}</div>
        </div>

        <div class="card">
          <div class="card-label">Analyst summary</div>
          <p style="font-size:0.9rem;color:var(--ink2);line-height:1.7">${d.summary}</p>
          <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);font-size:0.75rem;color:var(--ink3)">Analysis powered by AI · always verify with a physical inspection</div>
        </div>
      </div>

      <div class="grid1 card">
        <div class="card-label">Recommended reading</div>
        <div class="news-list">${news}</div>
      </div>

    </div>
  `);

  setTimeout(() => {
    const r = document.getElementById('rfill');
    if (r) r.style.width = d.rarity.score + '%';
  }, 200);
}
</script>
</body>
</html>
